<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Payoff layer inside the Bayesian portability model</title>
  <desc id="desc">A two-by-two payoff matrix for portable and locked actions. Each platform privately observes a low or high portability implementation cost before choosing an action.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis { font-size: 22px; font-weight: 750; fill: #172554; text-anchor: middle; }
      .action { font-size: 20px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .cell-title { font-size: 19px; font-weight: 750; fill: #0f172a; text-anchor: middle; }
      .payoff { font-size: 22px; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text class="font" x="600" y="46" font-size="28" font-weight="750" fill="#0f172a" text-anchor="middle">Strategic payoff layer</text>
  <text class="font" x="600" y="76" font-size="17" fill="#64748b" text-anchor="middle">Inside the Bayesian incomplete-information model — not a standalone complete-information game</text>

  <text class="font axis" x="676" y="120">PLATFORM B</text>
  <text class="font action" x="490" y="157">Portable (P)</text>
  <text class="font action" x="862" y="157">Locked (L)</text>
  <text class="font axis" x="93" y="350" transform="rotate(-90 93 350)">PLATFORM A</text>
  <text class="font action" x="180" y="276">Portable (P)</text>
  <text class="font action" x="180" y="465">Locked (L)</text>

  <g filter="url(#shadow)" class="font">
    <rect x="302" y="180" width="365" height="170" rx="18" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <text class="cell-title" x="484" y="220">MUTUAL PORTABILITY</text>
    <text class="payoff" x="484" y="269">A: 2 − c_A</text>
    <text class="payoff" x="484" y="308">B: 2 − c_B</text>

    <rect x="685" y="180" width="365" height="170" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text class="cell-title" x="867" y="220">ASYMMETRIC</text>
    <text class="payoff" x="867" y="269">A: −1 − c_A</text>
    <text class="payoff" x="867" y="308">B: 1</text>

    <rect x="302" y="368" width="365" height="170" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text class="cell-title" x="484" y="408">ASYMMETRIC</text>
    <text class="payoff" x="484" y="457">A: 1</text>
    <text class="payoff" x="484" y="496">B: −1 − c_B</text>

    <rect x="685" y="368" width="365" height="170" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text class="cell-title" x="867" y="408">MUTUAL LOCK-IN</text>
    <text class="payoff" x="867" y="457">A: 0</text>
    <text class="payoff" x="867" y="496">B: 0</text>
  </g>

  <g class="font">
    <rect x="224" y="580" width="752" height="68" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="600" y1="590" x2="600" y2="638" stroke="#cbd5e1" stroke-width="2"/>
    <text x="412" y="607" font-size="16" fill="#64748b" text-anchor="middle">PRIVATE IMPLEMENTATION COST</text>
    <text x="412" y="634" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">c_i ∈ {0.2, 1.2}</text>
    <text x="788" y="607" font-size="16" fill="#64748b" text-anchor="middle">BENCHMARK PRIOR</text>
    <text x="788" y="634" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">p = 0.7</text>
  </g>
</svg>
