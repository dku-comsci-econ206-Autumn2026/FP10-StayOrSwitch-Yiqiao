<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Stay or Switch behavioral artifact flow</title>
  <desc id="desc">A participant sees a scenario, chooses stay or switch, reports four ratings, sees the benchmark variables and switching rule, chooses again, and may see a same-session peer comparison.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .stepno { font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .step { font-size: 17px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text class="font" x="600" y="48" font-size="29" font-weight="750" fill="#0f172a" text-anchor="middle">Behavioral artifact: from scenario to reflection</text>
  <text class="font" x="600" y="77" font-size="16" fill="#64748b" text-anchor="middle">A bounded user-choice task separate from the platform game</text>

  <g class="font" filter="url(#shadow)">
    <rect x="24" y="120" width="142" height="128" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="48" cy="142" r="15" fill="#2563eb"/><text class="stepno" x="48" y="147">1</text>
    <text class="step" x="95" y="178"><tspan x="95">Scenario</tspan></text>

    <rect x="192" y="120" width="142" height="128" rx="18" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="216" cy="142" r="15" fill="#4f46e5"/><text class="stepno" x="216" y="147">2</text>
    <text class="step" x="263" y="168">Initial</text>
    <text class="step" x="263" y="194">Stay / Switch</text>

    <rect x="360" y="120" width="142" height="128" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="384" cy="142" r="15" fill="#7c3aed"/><text class="stepno" x="384" y="147">3</text>
    <text class="step" x="431" y="168">Four 1–7</text>
    <text class="step" x="431" y="194">ratings</text>

    <rect x="528" y="120" width="142" height="128" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="552" cy="142" r="15" fill="#9333ea"/><text class="stepno" x="552" y="147">4</text>
    <text class="step" x="599" y="168">Reveal</text>
    <text class="step" x="599" y="194">g, r, g − r</text>

    <rect x="696" y="120" width="142" height="128" rx="18" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="720" cy="142" r="15" fill="#0f766e"/><text class="stepno" x="720" y="147">5</text>
    <text class="step" x="767" y="158">Benchmark</text>
    <text class="step" x="767" y="184">Switch iff</text>
    <text class="step" x="767" y="210">g &gt; r</text>

    <rect x="864" y="120" width="142" height="128" rx="18" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="888" cy="142" r="15" fill="#0891b2"/><text class="stepno" x="888" y="147">6</text>
    <text class="step" x="935" y="168">Final</text>
    <text class="step" x="935" y="194">Stay / Switch</text>

    <rect x="1032" y="120" width="144" height="128" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="1056" cy="142" r="15" fill="#d97706"/><text class="stepno" x="1056" y="147">7</text>
    <text class="step" x="1104" y="158">Same-session</text>
    <text class="step" x="1104" y="184">peer</text>
    <text class="step" x="1104" y="210">comparison</text>
  </g>

  <g class="font" font-size="27" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="179" y="194">→</text><text x="347" y="194">→</text><text x="515" y="194">→</text>
    <text x="683" y="194">→</text><text x="851" y="194">→</text><text x="1019" y="194">→</text>
  </g>

  <g class="font">
    <rect x="154" y="302" width="892" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="337" font-size="22" font-weight="750" fill="#172554" text-anchor="middle">12 FIXED SCENARIOS</text>
    <text x="600" y="371" font-size="19" fill="#475569" text-anchor="middle">Full / Partial / None portability  ×  4 gain levels</text>

    <rect x="108" y="432" width="984" height="84" rx="20" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
    <text x="600" y="466" font-size="20" font-weight="750" fill="#115e59" text-anchor="middle">Implemented, publicly deployed, and technically verified.</text>
    <text x="600" y="495" font-size="18" fill="#334155" text-anchor="middle">No participant-level behavioral conclusion is claimed yet.</text>
  </g>
</svg>
