<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Research pipeline and interdisciplinary synthesis</title>
  <desc id="desc">A seven-stage research pipeline moves from competing AI assistants through platform strategy, welfare, mechanism design, auction allocation, and a behavioral test. Economics, computer science, and behavioral science converge into an interdisciplinary synthesis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 18px; font-weight: 650; fill: #172554; text-anchor: middle; }
      .small { font-size: 15px; fill: #475569; text-anchor: middle; }
      .lens-title { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text class="font" x="600" y="46" font-size="28" font-weight="750" fill="#0f172a" text-anchor="middle">From platform choice to user response</text>
  <text class="font" x="600" y="73" font-size="16" fill="#64748b" text-anchor="middle">One model, multiple analytical layers</text>

  <g class="font" filter="url(#shadow)">
    <rect x="28" y="110" width="140" height="112" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="98" y="151">Competing AI</text>
    <text class="label" x="98" y="178">Assistants</text>

    <rect x="195" y="110" width="140" height="112" rx="16" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text class="label" x="265" y="151">Portable</text>
    <text class="label" x="265" y="178">vs Locked</text>

    <rect x="362" y="110" width="140" height="112" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="432" y="151">Bayesian</text>
    <text class="label" x="432" y="178">Platform Game</text>

    <rect x="529" y="110" width="140" height="112" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
    <text class="label" x="599" y="151">Equilibrium</text>
    <text class="label" x="599" y="178">Multiplicity</text>

    <rect x="696" y="110" width="140" height="112" rx="16" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <text class="label" x="766" y="139">Social Choice</text>
    <text class="label" x="766" y="165">+ Mechanism</text>
    <text class="label" x="766" y="191">Design</text>

    <rect x="863" y="110" width="140" height="112" rx="16" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/>
    <text class="label" x="933" y="139">Auction</text>
    <text class="label" x="933" y="165">Allocation</text>
    <text class="label" x="933" y="191">Analogy</text>

    <rect x="1030" y="110" width="142" height="112" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="1101" y="139">Behavioral</text>
    <text class="label" x="1101" y="165">Stay / Switch</text>
    <text class="label" x="1101" y="191">Test</text>
  </g>

  <g class="font" font-size="27" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="181" y="176">→</text><text x="348" y="176">→</text><text x="515" y="176">→</text>
    <text x="682" y="176">→</text><text x="849" y="176">→</text><text x="1016" y="176">→</text>
  </g>

  <text class="font" x="600" y="282" font-size="18" font-weight="650" fill="#334155" text-anchor="middle">Three disciplinary lenses</text>

  <g class="font" filter="url(#shadow)">
    <rect x="116" y="310" width="260" height="88" rx="18" fill="#2563eb"/>
    <text class="lens-title" x="246" y="346">ECONOMICS</text>
    <text x="246" y="375" font-size="15" fill="#dbeafe" text-anchor="middle">strategy · welfare · incentives</text>

    <rect x="470" y="310" width="260" height="88" rx="18" fill="#4f46e5"/>
    <text class="lens-title" x="600" y="346">COMPUTER SCIENCE</text>
    <text x="600" y="375" font-size="15" fill="#e0e7ff" text-anchor="middle">verification · sweeps · simulation</text>

    <rect x="824" y="310" width="260" height="88" rx="18" fill="#0f766e"/>
    <text class="lens-title" x="954" y="346">BEHAVIORAL SCIENCE</text>
    <text x="954" y="375" font-size="15" fill="#ccfbf1" text-anchor="middle">choice · perception · trust</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M246 401 C246 440, 430 435, 470 462"/>
    <line x1="600" y1="401" x2="600" y2="457"/>
    <path d="M954 401 C954 440, 770 435, 730 462"/>
  </g>
  <g fill="#64748b">
    <path d="M462 455 L478 463 L463 471 Z"/>
    <path d="M592 455 H608 L600 469 Z"/>
    <path d="M738 455 L722 463 L737 471 Z"/>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="400" y="470" width="400" height="108" rx="22" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="600" y="515" font-size="22" font-weight="750" fill="#0f172a" text-anchor="middle">INTERDISCIPLINARY SYNTHESIS</text>
    <text class="small" x="600" y="545">Strategic feasibility · collective value</text>
    <text class="small" x="600" y="568">computational evidence · user response</text>
  </g>
</svg>
