<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark pure Bayesian Nash equilibria</title>
  <desc id="desc">Two result cards show the lock-in equilibrium and the conditional-portability equilibrium. These are exactly the two pure Bayesian Nash equilibria at the benchmark; a symmetric mixed equilibrium also exists.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>.font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text class="font" x="600" y="50" font-size="29" font-weight="750" fill="#0f172a" text-anchor="middle">Benchmark equilibrium multiplicity</text>
  <text class="font" x="600" y="79" font-size="16" fill="#64748b" text-anchor="middle">Two distinct self-enforcing outcomes coexist</text>

  <g class="font" filter="url(#shadow)">
    <rect x="70" y="112" width="500" height="242" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <rect x="70" y="112" width="500" height="62" rx="24" fill="#4f46e5"/>
    <path d="M70 150 H570 V174 H70 Z" fill="#4f46e5"/>
    <text x="320" y="153" font-size="23" font-weight="750" fill="#ffffff" text-anchor="middle" letter-spacing="1">LOCK-IN</text>
    <text x="320" y="229" font-size="42" font-weight="800" fill="#312e81" text-anchor="middle">(LL, LL)</text>
    <line x1="145" y1="253" x2="495" y2="253" stroke="#c7d2fe" stroke-width="2"/>
    <text x="320" y="289" font-size="19" fill="#334155" text-anchor="middle">Low-cost type → Locked</text>
    <text x="320" y="321" font-size="19" fill="#334155" text-anchor="middle">High-cost type → Locked</text>

    <rect x="630" y="112" width="500" height="242" rx="24" fill="#ecfeff" stroke="#0d9488" stroke-width="3"/>
    <rect x="630" y="112" width="500" height="62" rx="24" fill="#0f766e"/>
    <path d="M630 150 H1130 V174 H630 Z" fill="#0f766e"/>
    <text x="880" y="153" font-size="23" font-weight="750" fill="#ffffff" text-anchor="middle" letter-spacing="0.7">CONDITIONAL PORTABILITY</text>
    <text x="880" y="229" font-size="42" font-weight="800" fill="#115e59" text-anchor="middle">(PL, PL)</text>
    <line x1="705" y1="253" x2="1055" y2="253" stroke="#99f6e4" stroke-width="2"/>
    <text x="880" y="289" font-size="19" fill="#334155" text-anchor="middle">Low-cost type → Portable</text>
    <text x="880" y="321" font-size="19" fill="#334155" text-anchor="middle">High-cost type → Locked</text>
  </g>

  <g class="font">
    <rect x="110" y="386" width="980" height="74" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="414" font-size="17" fill="#475569" text-anchor="middle">BENCHMARK · p = 0.7 · c_L = 0.2 · c_H = 1.2</text>
    <text x="600" y="444" font-size="21" font-weight="750" fill="#172554" text-anchor="middle">Exactly two PURE BNE in the benchmark</text>
  </g>

  <text class="font" x="600" y="494" font-size="16" fill="#64748b" text-anchor="middle">A symmetric mixed equilibrium also exists.</text>
</svg>
