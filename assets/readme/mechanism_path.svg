<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Portability incentive and benchmark equilibrium sets</title>
  <desc id="desc">As the portability incentive tau rises from zero to 2.2, the set of symmetric pure Bayesian equilibria changes from lock-in and conditional portability to mutual portability only.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tau { font-size: 22px; font-weight: 750; fill: #172554; text-anchor: middle; }
      .set { font-size: 21px; font-weight: 700; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#f8fafc"/>
  <text class="font" x="600" y="48" font-size="29" font-weight="750" fill="#0f172a" text-anchor="middle">How the portability incentive changes the equilibrium set</text>
  <text class="font" x="600" y="77" font-size="16" fill="#64748b" text-anchor="middle">Benchmark prior p = 0.7 · symmetric pure BNE shown</text>

  <g class="font" filter="url(#shadow)">
    <rect x="38" y="118" width="190" height="142" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text class="tau" x="133" y="162">τ = 0.0</text>
    <line x1="68" y1="180" x2="198" y2="180" stroke="#c7d2fe" stroke-width="2"/>
    <text class="set" x="133" y="220">LL, PL</text>

    <rect x="272" y="118" width="190" height="142" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text class="tau" x="367" y="162">τ = 0.2</text>
    <line x1="302" y1="180" x2="432" y2="180" stroke="#c7d2fe" stroke-width="2"/>
    <text class="set" x="367" y="220">LL, PL, PP</text>

    <rect x="505" y="118" width="190" height="142" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text class="tau" x="600" y="162">τ = 0.8</text>
    <line x1="535" y1="180" x2="665" y2="180" stroke="#ddd6fe" stroke-width="2"/>
    <text class="set" x="600" y="220">LL, PL, PP</text>

    <rect x="738" y="118" width="190" height="142" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text class="tau" x="833" y="162">τ = 1.2</text>
    <line x1="768" y1="180" x2="898" y2="180" stroke="#bae6fd" stroke-width="2"/>
    <text class="set" x="833" y="220">LL, PP</text>

    <rect x="972" y="118" width="190" height="142" rx="20" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
    <text class="tau" x="1067" y="162">τ = 2.2</text>
    <line x1="1002" y1="180" x2="1132" y2="180" stroke="#99f6e4" stroke-width="2"/>
    <text class="set" x="1067" y="220" fill="#115e59">PP</text>
  </g>

  <g class="font" font-size="31" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="250" y="199">→</text><text x="484" y="199">→</text>
    <text x="717" y="199">→</text><text x="950" y="199">→</text>
  </g>

  <g class="font">
    <rect x="168" y="315" width="864" height="98" rx="22" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="600" y="352" font-size="20" font-weight="750" fill="#172554" text-anchor="middle">INCENTIVES CHANGE THE FEASIBLE EQUILIBRIUM SET</text>
    <text x="600" y="384" font-size="18" fill="#475569" text-anchor="middle">They do not automatically solve equilibrium selection.</text>
  </g>
</svg>
